name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.threads }} thread(s)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: ${{ matrix.version == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'   # LTS
          - '1.11'
          - '1'      # latest release
          - 'nightly'
        threads:
          - '4'
        include:
          # A single-threaded sanity leg: the library must also work without the
          # multithreaded STM test coverage.
          - version: '1.10'
            threads: '1'
          # ... and one leg above the usual four, where the STM sees contention
          # no other leg does.
          - version: '1.10'
            threads: '8'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: airdb
          POSTGRES_PASSWORD: airdb
          POSTGRES_DB: airdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U airdb -d airdb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JULIA_NUM_THREADS: ${{ matrix.threads }}
      AIRDB_TEST_HOST: localhost
      AIRDB_TEST_PORT: '5432'
      AIRDB_TEST_USER: airdb
      AIRDB_TEST_PASSWORD: airdb
      AIRDB_TEST_DBNAME: airdb_test
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          show-versioninfo: true
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          julia_args: --threads=${{ matrix.threads }}
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true
