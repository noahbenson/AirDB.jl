name: Docs

# Builds both documentation sites and deploys them to GitHub Pages together: the
# Documenter API reference (`docs/`) at the root, and the Jupyter Book 2 / MyST
# guide (`book/`) under `/book/`.
on:
  push:
    branches: [main]
    tags: ['*']
  # Deliberately not restricted to PRs targeting `main`: PRs stacked on another
  # feature branch need CI too.
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4

      # The Documenter API reference, deployed to the root of the site. It also
      # owns the versioned subdirectories (`/stable/`, `/dev/`, `/v0.1.0/`).
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}

      # The written guide, deployed to `/book/`. `keep_files` leaves the
      # Documenter site above untouched.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build the book
        working-directory: book
        run: npx -y mystmd@latest build --html
      - name: Deploy the book to /book/
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: book/_build/html
          destination_dir: book
          keep_files: true
