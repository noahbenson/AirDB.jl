name: Docs

# Builds the one MyST/Jupyter Book site under `docs/` — the written guide plus
# the API reference generated from the package docstrings — and deploys it to
# GitHub Pages at the project root. Pull requests build but do not deploy.
on:
  push:
    branches: [main]
  # Deliberately not restricted to PRs targeting `main`: PRs stacked on another
  # feature branch need CI too.
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1

      # The API pages are generated from the package's docstrings and are not
      # committed; `--strict` fails on a missing or duplicated entry.
      - name: Generate the API reference
        run: julia --project=. docs/scripts/generate_api.jl --strict

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The project site is served at /AirDB.jl (the github.io URL redirects to
      # the custom domain with the same path), so asset and navigation links
      # need that base.
      - name: Build the book
        working-directory: docs
        env:
          BASE_URL: /AirDB.jl
        run: npx -y mystmd@1.12.0 build --html

      # MyST 1.12 has no site-URL option: rewrite the sitemap's local origin.
      - name: Fix the sitemap origin
        working-directory: docs/_build/html
        run: |
          for f in sitemap.xml sitemap_style.xsl; do
            [ -f "$f" ] && sed -i 's|http://localhost:[0-9]*|https://nben.net/AirDB.jl|g' "$f"
          done

      - name: Check internal links
        run: julia --project=. docs/scripts/check_links.jl

      # `force_orphan` replaces the whole tree, removing the old Documenter
      # `/dev/` and the old book `/book/` along with it.
      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html
          force_orphan: true
