# A throwaway PostgreSQL instance for AirDB's test suite. The library itself
# never manages a database — it connects to one the user configures — so this
# file exists only to give the tests a server to talk to.
#
#   docker compose up -d      # start it
#   docker compose down -v    # stop it and delete the data
#
# The credentials below match the defaults in test/helpers.jl. Override the
# connection in tests with AIRDB_TEST_URL.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airdb
      POSTGRES_PASSWORD: airdb
      POSTGRES_DB: airdb_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airdb -d airdb_test"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - airdb_pgdata:/var/lib/postgresql/data

volumes:
  airdb_pgdata:
